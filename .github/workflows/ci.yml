name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Fairness smoke check (no API)
        run: python -m or_eval.cli fairness-smoke --output-dir /tmp/ci_smoke
      - name: Strict fairness audit
        run: python -m or_eval.cli fairness-audit --results-dir /tmp/ci_smoke --strict
