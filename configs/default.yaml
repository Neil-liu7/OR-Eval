api_url: "http://ebill.baidu-int.com/v1/models/{model}"

api:
  # Prefer exporting OR_EVAL_API_KEY instead of editing this file.
  api_key_env: "OR_EVAL_API_KEY"
  max_tokens: 4096
  temperature: 0

# Per-model max_tokens override for thinking/reasoning models
model_overrides:
  gemini-2.5-pro:
    max_tokens: 16384
  o3-mini:
    max_tokens: 16384
  o4-mini:
    max_tokens: 16384
  deepseek-r1:
    max_tokens: 16384

models:
  - deepseek-v3
  - deepseek-v3.2
  - gpt-4o
  - gpt-4o-mini
  - gpt-4.1-mini
  - gpt-4.1
  - o4-mini
  - gemini-2.5-pro
  - qwen-max
  - qwen3-235b-a22b

datasets:
  - NL4OPT
  - MAMO_EasyLP
  - MAMO_ComplexLP
  - OptiBench
  - IndustryOR
  - OptMATH_Bench

execution:
  timeout: 30
  memory_limit_mb: 2048

prompt_search:
  seed: 42
  per_dataset: 50
  final_full: true

evaluation:
  tolerance_primary: 0.05
  tolerances: [0.05, 0.01, 0.0001]
  concurrency: 4
