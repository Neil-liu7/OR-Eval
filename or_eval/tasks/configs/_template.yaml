# Example: Adding a new OR benchmark to OR-Eval
#
# 1. Place your data file in data/ (JSONL or JSON format)
# 2. Copy this template to or_eval/tasks/configs/<your_benchmark>.yaml
# 3. Fill in the fields below
# 4. Run: python -m or_eval.cli tasks  (verify it's discovered)
# 5. Run: python -m or_eval.cli evaluate --datasets <your_benchmark>

name: MyNewBenchmark
dataset_file: my_new_benchmark.jsonl   # relative to data_dir
question_field: en_question            # JSON field containing the problem text
answer_field: en_answer                # JSON field containing the ground truth value

# Problem classification
problem_type: linear_programming       # LP, MIP, NLP, combinatorial, stochastic, mixed
difficulty: medium                     # easy, medium, hard, expert, mixed
capabilities:                          # what this benchmark tests
  - formulation
  - coding
  - solver_selection
  - constraint_modeling
  - domain_knowledge
  - mathematical_reasoning
  - nl_understanding

# Metrics (subset of available OR-Eval metrics)
metrics:
  - acc_5pct
  - acc_1pct
  - executable_rate
  - solve_rate
  - variable_output_rate

# Evaluation mode
evaluation_mode: single_pass           # single_pass | multi_turn | agent

# Few-shot configuration (optional)
few_shot:
  enabled: false
  default_shots: 0
  max_shots: 5
  selection: random                    # random | difficulty_matched | type_matched
  examples_file: null                  # optional path to curated examples

# Metadata
description: "Description of your benchmark"
source: "Author et al., 2025"
metadata:
  url: "https://github.com/..."
  license: "Apache-2.0"
  num_problems: 100
