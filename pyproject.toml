[project]
name = "or-eval"
version = "0.2.0"
description = "Unified, solver-neutral, reproducible evaluation framework for OR large language models"
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
solvers = ["cvxpy>=1.4.0", "pyomo>=6.0.0", "networkx>=3.0"]
all-providers = ["openai>=1.0.0", "anthropic>=0.20.0"]
all = ["openai>=1.0.0", "anthropic>=0.20.0", "cvxpy>=1.4.0", "pyomo>=6.0.0", "networkx>=3.0"]

[project.scripts]
or-eval = "or_eval.cli:main"
